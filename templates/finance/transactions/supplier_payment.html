{% extends 'base.html' %}
{% block title %}دفع لمورد{% endblock %}
{% block content %}
<div class="simple-form-page">
    <div class="page-head">
        <h1>دفع لمورد</h1>
    </div>

    <form method="post" class="simple-form">
        {% csrf_token %}
        
        <div class="form-group">
            <label>المورد</label>
            {{ form.supplier }}
        </div>

        <div class="form-group">
            <label>المبلغ</label>
            {{ form.amount }}
        </div>

        <div class="form-group">
            <label>الخزنة</label>
            {{ form.cash_account }}
        </div>

        <div class="form-group">
            <label>تاريخ الدفع</label>
            {{ form.transaction_date }}
        </div>

        <div class="form-group">
            <label>ملاحظات</label>
            {{ form.notes }}
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">حفظ</button>
            <a href="{% url 'finance:cash' %}" class="btn btn-light">إلغاء</a>
        </div>
    </form>
</div>
{% endblock %}
