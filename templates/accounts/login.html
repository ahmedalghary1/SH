{% extends 'base.html' %}
{% block title %}تسجيل الدخول{% endblock %}
{% block auth_content %}
<main class="login-page">
    <section class="login-card">
        <div class="login-logo">م</div>
        <h1>تسجيل الدخول</h1>
        <p class="login-subtitle">نظام إدارة الملابس والمخزون والطلبات</p>
        <form method="post" action="{% url 'accounts:login' %}" class="form-grid">
            {% csrf_token %}
            {% if redirect_field_value %}
                <input type="hidden" name="{{ redirect_field_name }}" value="{{ redirect_field_value }}">
            {% endif %}
            {% if form.non_field_errors %}
                <div class="form-errors">{{ form.non_field_errors }}</div>
            {% endif %}
            <label><span>{{ form.username.label }}</span>{{ form.username }}</label>
            <label><span>{{ form.password.label }}</span>{{ form.password }}</label>
            <button class="btn btn-primary full-width" type="submit">دخول</button>
        </form>
    </section>
</main>
{% endblock %}
