{% extends 'base.html' %}
{% block title %}تسجيل الدخول{% endblock %}
{% block auth_content %}
<main class="login-page">
    <section class="login-card">
        <div class="login-logo">SH</div>
        <h1>تسجيل الدخول إلى نظام إدارة الملابس</h1>
        <form method="post" class="form-grid">
            {% csrf_token %}
            {% if form.non_field_errors %}
                <div class="form-errors">{{ form.non_field_errors }}</div>
            {% endif %}
            <label>{{ form.username.label }} {{ form.username }}</label>
            <label>{{ form.password.label }} {{ form.password }}</label>
            <button class="btn btn-primary full-width" type="submit">دخول</button>
        </form>
    </section>
</main>
{% endblock %}
