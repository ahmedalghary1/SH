<div class="modal" id="customer-modal" hidden>
    <div class="modal-box">
        <div class="modal-head"><h2>إضافة عميل سريع</h2><button class="icon-btn" type="button" data-close-modal>&times;</button></div>
        <div class="form-grid">
            <label>الاسم <input id="quick-customer-name"></label>
            <label>النوع <select id="quick-customer-type"><option value="b2c">عميل فردي</option><option value="b2b">عميل جملة / شركة</option></select></label>
            <label>الهاتف <input id="quick-customer-phone"></label>
            <label>واتساب <input id="quick-customer-whatsapp"></label>
            <label>الشركة <input id="quick-customer-company"></label>
            <label>الرقم الضريبي <input id="quick-customer-tax"></label>
            <label class="span-2">العنوان <textarea id="quick-customer-address"></textarea></label>
        </div>
        <div class="form-actions"><button class="btn btn-primary" type="button" id="quick-customer-save">حفظ العميل</button></div>
    </div>
</div>
