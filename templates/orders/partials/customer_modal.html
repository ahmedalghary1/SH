<div class="modal" id="customer-modal" hidden>
    <div class="modal-box">
        <div class="modal-head">
            <h2>إضافة عميل سريع</h2>
            <button class="icon-btn" type="button" data-close-modal aria-label="إغلاق">×</button>
        </div>
        <div class="form-grid">
            <label><span>اسم العميل</span><input id="quick-customer-name"></label>
            <label><span>نوع العميل</span><select id="quick-customer-type"><option value="retail">قطاعي</option><option value="wholesale">جملة</option></select></label>
            <label><span>الهاتف</span><input id="quick-customer-phone"></label>
            <label class="span-2"><span>العنوان</span><textarea id="quick-customer-address" rows="3"></textarea></label>
        </div>
        <div class="form-actions"><button class="btn btn-primary" type="button" id="quick-customer-save">حفظ العميل</button></div>
    </div>
</div>
