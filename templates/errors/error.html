<!doctype html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="theme-color" content="#123c69">
    <title>{{ title }} — SH</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f7f9fc; color: #13263d; font: 17px/1.8 system-ui,sans-serif; padding: 20px; }
        main { width: min(540px,100%); background: white; border: 1px solid #d8e0ea; border-radius: 8px; padding: 28px; }
        h1 { font-size: 24px; margin: 0; } p { margin: 14px 0; }
        nav { display: flex; gap: 12px; flex-wrap: wrap; } a,button { background: #123c69; color: white; border: 0; border-radius: 6px; font: inherit; padding: 8px 14px; text-decoration: none; cursor: pointer; }
        button { background: #edf2f7; color: #13263d; } a:focus-visible,button:focus-visible { outline: 3px solid #539bd7; outline-offset: 3px; }
        code { overflow-wrap: anywhere; user-select: all; }
    </style>
</head>
<body><main>
    <h1>{{ title }}</h1>
    <p>{{ message }}</p>
    {% if request_id %}<p>رقم المتابعة: <code dir="ltr">{{ request_id }}</code></p>{% endif %}
    <nav aria-label="العودة للتطبيق"><button type="button" onclick="history.back()">رجوع</button><a href="/">الصفحة الرئيسية</a><a href="/accounts/login/">تسجيل الدخول</a></nav>
</main></body>
</html>
